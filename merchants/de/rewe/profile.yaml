# merchants/de/rewe/profile.yaml
#
# REWE Markt — Profil v1
# Getestet gegen: Schulstraße 46-48, 21220 Maschen, Bon vom 20.05.2026
# Layout-Variante: 2026-classic (Stand: 2026-05-20)
#
schema_version: 1

merchant:
  id: de.rewe
  name: REWE
  country: DE
  brand_variants:
    - "REWE"
    - "REWE Markt"
    - "REWE MARKT"
    - "REWE Markt GmbH"

  detection:
    # Erkennungsmuster im OCR-Text — höchste Konfidenz zuerst
    header_patterns:
      - regex: '(?im)^\s*REWE\s+MARKT\s*$'
        confidence: 0.9
      - regex: '(?i)REWE\s+Markt\s+GmbH'
        confidence: 1.0
      - regex: '(?i)www\.rewe\.de'
        confidence: 0.85
      - regex: '(?i)UID\s*Nr\.?:\s*DE\d{9}'
        confidence: 0.4   # UID-Format alleine reicht nicht
    
    # Optional: Logo-Hash für Bild-basierte Erkennung
    logo_hashes:
      - source: "samples/2026-classic.jpeg"
        sha256: null   # später eintragen
    
    # Mindest-Score für Übernahme (Summe der Match-Konfidenzen)
    minimum_score: 0.7

# Steuerklassen — REWE-spezifisch
# Wichtig: REWE nutzt nur 'B' im Beispiel-Bon, aber Mapping bleibt händlerweit.
# Lebensmittel = 7% MwSt, Non-Food = 19% MwSt (deutsche Standardklassifikation)
tax_classes:
  A:
    rate: 0.19
    description: "19% MwSt (Standard, z.B. Non-Food)"
  B:
    rate: 0.07
    description: "7% MwSt (Lebensmittel)"
  # Hinweis: REWE kehrt die übliche Lidl/Edeka-Konvention um — bei Lidl ist A=7%, B=19%

detection:
  header_patterns:
    - regex: '(?im)^\s*REWE\s+MARKT\s*$'
      confidence: 0.9
    - regex: '(?i)REWE\s+Markt\s+GmbH'
      confidence: 1.0
    - regex: '(?i)www\.rewe\.de'
      confidence: 0.85
    - regex: '(?i)UID\s*Nr\.?\s*:\s*DE\d{9}'
      confidence: 0.4
  minimum_score: 0.7

item_patterns:
  - id: rewe_weight_item
    kind: weight_item
    primary: '^(?P<name>[A-ZÄÖÜ0-9][A-ZÄÖÜ0-9./&!%\-, ]{0,33}?)\s{2,}(?P<total>\d+,\d{2})\s+(?P<tax_class>[AB])\s*$'
    secondary: '^\s+(?P<weight>\d+,\d{3})\s*kg\s*x\s+(?P<price_per_kg>\d+,\d{2})\s*EUR/kg\s*$'
    requires_secondary: true

  - id: rewe_weight_item_handeingabe
    kind: weight_item
    primary: '^(?P<name>[A-ZÄÖÜ0-9][A-ZÄÖÜ0-9./&!%\-, ]{0,33}?)\s{2,}(?P<total>\d+,\d{2})\s+(?P<tax_class>[AB])\s*$'
    secondary: '^\s*Handeingabe\s+E-Bon\s+(?P<weight>\d+,\d{3})\s*kg\s*$'
    requires_secondary: true

  - id: rewe_quantity_item
    kind: quantity_item
    primary: '^(?P<name>[A-ZÄÖÜ0-9][A-ZÄÖÜ0-9./&!%\-, ]{0,33}?)\s{2,}(?P<total>\d+,\d{2})\s+(?P<tax_class>[AB])\s*$'
    secondary: '^\s+(?P<qty>\d+)\s+Stk\s+x\s+(?P<unit_price>\d+,\d{2})\s*$'
    requires_secondary: true

  - id: rewe_simple_item
    kind: item
    primary: '^(?P<name>[A-ZÄÖÜ0-9][A-ZÄÖÜ0-9./&!%\-, ]{0,33}?)\s{2,}(?P<total>\d+,\d{2})\s+(?P<tax_class>[AB])\s*$'
    requires_secondary: false

pfand_patterns:
  - id: rewe_pfand_einweg
    kind: pfand_einweg
    regex: '^\s*PFAND\s+(?P<amount>\d+,\d{2})\s+EURO\s+(?P<total>\d+,\d{2})\s+(?P<tax_class>[AB])\s+\*\s*$'
    attach_to: previous_item
    flags: [not_rebate_eligible]

  - id: rewe_pfand_return
    kind: pfand_return
    regex: '^(?P<name>LEERGUT\s+EINWEG)\s+(?P<total>-\d+,\d{2})\s+(?P<tax_class>[AB])\s+\*\s*$'
    secondary: '^\s*(?P<qty>\d+)\s+Stk\s+x\s+(?P<unit_amount>\d+,\d{2})\s*$'
    attach_to: none
    flags: [not_rebate_eligible]

discount_patterns:
  - id: rewe_frischerabatt
    kind: discount
    regex: '^\s*(?:\d+\s+x\s+)?(?P<name>Frischerabatt)\s+(?P<total>-\d+,\d{2})\s+(?P<tax_class>[AB])\s*$'
    attach_to: previous_item

date_extraction:
  - description: "Datum und Uhrzeit im Kundenbeleg-Block"
    regex: 'Datum:\s+(?P<date>\d{2}\.\d{2}\.\d{4})'
    date_format: "%d.%m.%Y"
    time_regex: 'Uhrzeit:\s+(?P<time>\d{2}:\d{2}:\d{2})'
    time_format: "%H:%M:%S"

store_extraction:
  address_line:
    regex: '^\s*(?P<street>(?!.*:)[A-ZÄÖÜ][A-Za-zÄÖÜäöüß0-9./\- ]+\s+\d+(?:-\d+)?)\s*$'
  city_line:
    regex: '^\s*(?P<zip>\d{5})\s+(?P<city>[A-ZÄÖÜ][A-Za-zÄÖÜäöüß-]+(?:\s+[A-ZÄÖÜ][A-Za-zÄÖÜäöüß-]+)?)\s*$'
  store_id:
    regex: 'Markt:(?P<store_id>\d{4})'

totals:
  grand_total: '^\s*SUMME\s+EUR\s+(?P<amount>\d+,\d{2})\s*$'
  payment: '^\s+Geg\.\s+(?P<method>Mastercard|Visa|EC-Cash|Bargeld|Maestro)\s+EUR\s+(?P<amount>\d+,\d{2})\s*$'

tax_breakdown:
  table_header: 'Steuer\s+%\s+Netto\s+Steuer\s+Brutto'
  row_regex: '^\s+(?P<class>[AB])=\s+(?P<rate>\d+,\d+)%\s+(?P<net>\d+,\d{2})\s+(?P<tax>\d+,\d{2})\s+(?P<gross>\d+,\d{2})\s*$'

loyalty:
  program: "REWE Bonus"
  earned_cashback: 'Mit diesem Einkauf hast du\s+(?P<amount>\d+,\d{2})\s+EUR'
  balance: 'Aktuelles Bonus-Guthaben:\s+(?P<balance>\d+,\d{2})\s+EUR'

