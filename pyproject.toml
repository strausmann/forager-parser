[project]
name = "forager-parser"
version = "0.1.0"
description = "Profile-driven receipt parser for the Forager / Hangar ecosystem"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "Forager Parser Contributors"}
]
keywords = ["receipt", "parser", "ocr", "grocy", "snipe-it"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "click>=8.1",
]

[project.optional-dependencies]
claude = ["anthropic>=0.40"]
dev = [
    "pytest>=8.0",
    "jsonschema>=4.20",
    "pre-commit>=3.5",
]

[project.scripts]
forager-parser = "forager_parser.cli:cli"

[project.urls]
Repository = "https://github.com/strausmann/forager-parser"
Issues = "https://github.com/strausmann/forager-parser/issues"
Documentation = "https://github.com/strausmann/forager-parser/blob/main/docs/architecture.md"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
