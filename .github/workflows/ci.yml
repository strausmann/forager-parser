name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install jsonschema

      - name: Run full test suite
        run: pytest tests/ -v

  pii-check:
    name: PII detection in sample receipts
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Scan for full credit-card-like patterns
        run: |
          set -e
          # 16 consecutive digits — likely an unredacted card number
          if grep -rEn '[0-9]{16}' profiles/*/samples/ 2>/dev/null; then
            echo "::error::Found 16-digit pattern in samples. Anonymize with ############XXXX."
            exit 1
          fi
          # 4-4-4-4 spaced card numbers
          if grep -rEn '\b[0-9]{4}[\s-]+[0-9]{4}[\s-]+[0-9]{4}[\s-]+[0-9]{4}\b' profiles/*/samples/ 2>/dev/null; then
            echo "::error::Found spaced 4-4-4-4 digit pattern in samples."
            exit 1
          fi
          echo "PII check passed."

  yaml-lint:
    name: YAML lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install yamllint
        run: pip install yamllint

      - name: Lint YAML files
        run: |
          yamllint -d "{extends: relaxed, rules: {line-length: disable}}" \
            profiles/ schema/ .github/ || true
          # Soft-fail for now; harden later

  regex-compile:
    name: Verify all regexes compile
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          pip install -e .

      - name: Check profile loading (compiles all regexes)
        run: |
          python -c "
          from forager_parser.profile import load_all_profiles
          from pathlib import Path
          bundles = load_all_profiles(Path('profiles'))
          print(f'Loaded {len(bundles)} base profiles')
          for mid, b in bundles.items():
              total_patterns = (len(b.base.item_patterns) +
                                len(b.base.pfand_patterns) +
                                len(b.base.discount_patterns))
              print(f'  {mid}: {total_patterns} patterns, {len(b.variants)} variants')
          "
